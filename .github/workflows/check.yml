name: Check AgentWorks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync_agents.py --check
      - run: python -m unittest discover -s tests -v
      - name: Validate generated host adapters
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          for path in Path('.codex/agents').glob('*.toml'):
              data = tomllib.loads(path.read_text())
              assert all(data.get(k) for k in ('name', 'description', 'developer_instructions'))
          # The generator emits JSON scalars, a strict subset of YAML scalars.
          for path in Path('.claude/agents').glob('*.md'):
              frontmatter = path.read_text().split('---', 2)[1]
              data = {key: json.loads(value) for key, value in
                      (line.split(': ', 1) for line in frontmatter.strip().splitlines())}
              assert data['name'] == path.stem
              assert data['description'] and data['model'] == 'inherit'
          PY
